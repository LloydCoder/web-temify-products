name: Product monorepo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: products-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    name: Catalogue and workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile
      - name: Validate canonical catalogue
        run: pnpm catalog:validate
      - name: Build and test admitted product workspaces
        run: pnpm products:check
      - name: Verify product manifest schema is valid JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('schemas/product-manifest.schema.json', 'utf8'))"
      - name: Verify no accidental secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.pem$|.*\.key$|id_rsa$|credentials\.json$)'; then
            echo "Potential secret-bearing file is tracked" >&2
            exit 1
          fi
