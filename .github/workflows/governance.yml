name: Product governance contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    name: JSON Schema 2020-12 and inventory contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.18.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install reproducibly
        run: pnpm install --frozen-lockfile
      - name: Validate canonical catalogue invariants
        run: node scripts/validate-catalog.mjs
      - name: Validate admitted product manifests and release gates
        run: node scripts/validate-product-manifests.mjs
      - name: Verify generated registry lock is current
        run: pnpm registry:check
      - name: Test product scaffolder and registry runtime
        run: pnpm quality:check && node --test tests/*.test.mjs
      - name: Validate launch-kit manifests against composition schema
        shell: bash
        run: |
          set -euo pipefail
          for manifest in kits/manifests/*.json; do
            echo "Validating $manifest"
            pnpm dlx ajv-cli@5.0.0 validate --spec=draft2020 -s schemas/launch-kit-manifest.schema.json -d "$manifest"
          done
      - name: Compile every JSON Schema as Draft 2020-12
        shell: bash
        run: |
          set -euo pipefail
          for schema in schemas/*.schema.json; do
            echo "Compiling $schema"
            pnpm dlx ajv-cli@5.0.0 compile --spec=draft2020 -s "$schema"
          done
      - name: Validate canonical catalogue against its JSON Schema
        run: pnpm dlx ajv-cli@5.0.0 validate --spec=draft2020 -s schemas/catalog.schema.json -d catalog/products.json
      - name: Validate admitted product manifest against its JSON Schema
        run: pnpm dlx ajv-cli@5.0.0 validate --spec=draft2020 -s schemas/product-manifest.schema.json -d products/courier-logistics-template/product.manifest.json
